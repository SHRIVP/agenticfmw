<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pcagent</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" defer></script>
  <script src="/static/app.js" type="module"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="mark" aria-hidden="true">◆</span> pcagent</div>
      <button id="new-chat" class="new-chat" type="button">+ New chat</button>
      <div class="side-label">Conversations</div>
      <nav id="threads" class="threads" aria-label="Conversations"></nav>
      <div class="side-foot">Policy-checked insurance agent · local POC</div>
    </aside>

    <main class="main">
      <div id="banner" class="banner" hidden></div>
      <div id="scroll" class="scroll">
        <div id="conversation" class="conversation">
          <div id="empty" class="empty">
            <h1>What can I help with?</h1>
            <p>Every action the agent takes is checked first: allowed, sent to you for approval, or blocked.</p>
            <div class="suggestions">
              <button type="button" class="suggestion">Find policy PA-200001-01</button>
              <button type="button" class="suggestion">Add a 2022 Honda Civic, VIN 1HGCV1F30NA000001, to PA-200001-01 effective 2026-12-01 and quote it</button>
              <button type="button" class="suggestion">Summarize the claim notes on PA-200001-01</button>
            </div>
          </div>
        </div>
      </div>

      <form id="composer" class="composer">
        <div class="composer-box">
          <textarea id="input" rows="1" placeholder="Message pcagent…" aria-label="Message"></textarea>
          <button id="send" class="send" type="submit" aria-label="Send">↑</button>
        </div>
        <div class="hint">Enter to send · Shift+Enter for a new line</div>
      </form>
    </main>
  </div>
</body>
</html>
