# Tool policy. Rules are checked before Jev.
#   allow             run without asking
#   require_approval  pause the run until a person approves or rejects
#   deny              never run; the agent is told why
#   evaluate          ask Jev; run automatically only if every check passes
# Exact names beat globs; the longest matching glob wins.

default: evaluate          # tools with no rule
read_only_default: allow   # tools whose MCP annotations say read-only

rules:
  # Everywire PAS (gwmcp)
  search_*: allow
  open_policy: allow
  bind_policy_change: deny          # binding is a human action in the PAS view
  withdraw_policy_change: require_approval
  create_account: require_approval  # creates a customer record
  # Everything else (start_policy_change, add_vehicle, update_coverage, quote_...)
  # falls to `evaluate`.

jev:
  enabled: true
  thresholds:
    intent_min: 0.7
    grounded_min: 0.6
    injected_max: 0.3
    impact_max: 1.5   # levels: 0 read, 1 draft edit, 2 shared records, 3 commits
