services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: pcagent
      POSTGRES_PASSWORD: pcagent
      POSTGRES_DB: pcagent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pcagent -d pcagent"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://pcagent:pcagent@db:5432/pcagent
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata:
